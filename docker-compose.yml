services:
  1panel-status:
    build: .
    container_name: 1panel-status
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "127.0.0.1:5285:5285"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./index.html:/app/index.html:ro
    environment:
      - PORT=5285
      - REQ_TIMEOUT_MS=6000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5285/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
