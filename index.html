<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" type="image/png" sizes="128x128" href="/logo.png">
<title>服务器状态</title>
<style>
  :root{
    --bg: #0c0d10;
    --panel: #16181f;
    --panel-2: #1c1f27;
    --line: #262a35;
    --text: #e7e7ea;
    --text-dim: #8b8f9a;
    --text-mute: #5a5e69;
    --accent: #8b5cf6;
    --accent-2: #ff7a59;
    --accent-3: #5ad1ff;
    --warn: #ffd166;
    --danger: #ff5b6b;
    --ok: #8af0a4;
    --ring-bg: #21242d;

    --glow-1: rgba(200,255,62,.05);
    --glow-2: rgba(90,209,255,.04);
    --card-glow: rgba(200,255,62,.04);
    --dot-glow: 0 0 10px var(--accent);
    --ok-glow:  0 0 6px var(--ok);
    --ok-glow-sm: 0 0 5px var(--ok);
    --inset-tint: rgba(0,0,0,.2);

    --tip-bg: #1a1d25;
    --tip-border: #2e333f;
    --tip-shadow: 0 12px 32px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);

    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    --font-num: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                "Liberation Mono", "Courier New", monospace;

    --card-max: 860px;
  }

  @media (prefers-color-scheme: light){
    :root{
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-2: #fbfbfc;
      --line: #e5e7ec;
      --text: #1a1c22;
      --text-dim: #5a5e69;
      --text-mute: #9095a0;
      --accent: #a8e635;
      --accent-2: #d94e2b;
      --accent-3: #0a8ec7;
      --warn: #c98a00;
      --danger: #d62c3d;
      --ok: #2a9e4f;
      --ring-bg: #e6e8ec;

      --glow-1: transparent;
      --glow-2: transparent;
      --card-glow: transparent;
      --dot-glow: none;
      --ok-glow: none;
      --ok-glow-sm: none;
      --inset-tint: rgba(0,0,0,.03);

      --tip-bg: #ffffff;
      --tip-border: #d8dbe1;
      --tip-shadow: 0 10px 28px rgba(20,25,40,.14), 0 2px 6px rgba(20,25,40,.08);
    }
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 85% -10%, var(--glow-1), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, var(--glow-2), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    font-size:13px;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{
    max-width: var(--card-max);
    margin: 0 auto;
    padding: 32px 24px 56px;
  }

  header{
    display:flex; justify-content:space-between; align-items:flex-end;
    gap:24px; padding-bottom:18px;
    border-bottom:1px solid var(--line); margin-bottom:24px;
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand .dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--accent); box-shadow:var(--dot-glow);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.55;transform:scale(.82)} }
  .brand h1{
    margin:0; font-size:22px; font-weight:600;
    letter-spacing:-.01em; line-height:1;
  }
  .brand h1 span{ color:var(--accent) }
  .brand .sub{
    color:var(--text-mute); font-size:10.5px;
    text-transform:uppercase; letter-spacing:.22em;
  }
  .meta{
    color:var(--text-dim); font-size:12px;
    display:flex; gap:18px; align-items:center; flex-wrap:wrap;
  }
  .meta b{ color:var(--text); font-weight:600; font-family:var(--font-num) }
  .meta .pill{
    display:inline-flex; align-items:center; gap:7px;
    padding:5px 11px; border:1px solid var(--line); border-radius:99px;
    background:var(--panel);
  }
  .meta .pill::before{
    content:""; width:6px; height:6px; border-radius:50%;
    background:var(--ok); box-shadow:var(--ok-glow);
  }

  .stack{ display:flex; flex-direction:column; gap:14px; }

  .card{
    background:linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 22px;
    position:relative;
    min-width:0;
  }
  .card.offline{ opacity:.55 }
  .card::after{
    content:""; position:absolute; top:0; right:0;
    width:140px; height:100%;
    background:radial-gradient(circle at top right, var(--card-glow), transparent 70%);
    pointer-events:none;
    border-top-right-radius:14px;
    border-bottom-right-radius:14px;
  }

  .card-head{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-bottom:14px;
  }
  .card-head .name{
    font-size:18px; font-weight:600; letter-spacing:-.01em;
    color:var(--text); line-height:1.2;
    min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .uptime-badge{
    display:inline-flex; align-items:center; gap:7px;
    padding:5px 12px; border:1px solid var(--line); border-radius:99px;
    font-size:12px; color:var(--text-dim);
    background:var(--inset-tint);
    flex-shrink:0;
    font-family:var(--font-num);
    white-space:nowrap;
  }
  .uptime-badge::before{
    content:""; width:5px; height:5px; border-radius:50%;
    background:var(--ok); box-shadow:var(--ok-glow-sm);
    flex-shrink:0;
  }
  .uptime-badge.off{ color:var(--text-mute) }
  .uptime-badge.off::before{ background:var(--danger); box-shadow:none }

  .card-body{
    display:grid;
    grid-template-columns: 1fr auto;
    gap:22px;
    align-items:center;
  }

  .rings{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
    min-width:0;
  }
  .ring-cell{
    display:flex; align-items:center; justify-content:center;
    min-width:0;
    cursor:default;
  }
  .ring{
    position:relative;
    width:96px; height:96px;
  }
  .ring svg{
    width:100%; height:100%;
    transform: rotate(-90deg);
  }
  .ring .track{
    fill:none; stroke:var(--ring-bg); stroke-width:6;
  }
  .ring .arc{
    fill:none; stroke-width:6; stroke-linecap:round;
    stroke-dasharray: 0 999;
    transition: stroke-dasharray .6s cubic-bezier(.2,.7,.2,1), stroke .3s;
  }
  .ring .label{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    color:var(--text); line-height:1;
    text-align:center;
    pointer-events:none;
    padding:0 4px;
  }
  .ring .label .num{
    font-family:var(--font-num);
    font-weight:600;
    font-size:21px;
    letter-spacing:-.03em;
    display:inline-flex; align-items:baseline; justify-content:center;
  }
  .ring .label .num small{
    font-size:12px;
    color:var(--text-dim);
    font-weight:500;
    margin-left:2px;
  }
  .ring .label .cap{
    margin-top:5px;
    font-size:11px;
    color:var(--text-mute);
    text-transform:uppercase;
    letter-spacing:.12em;
    font-weight:500;
  }

  .traffic{
    display:flex; flex-direction:column;
    justify-content:center;
    gap:9px;
    font-family:var(--font-num);
    white-space:nowrap;
  }
  .traffic .row{
    display:flex; align-items:baseline; gap:9px;
  }
  .traffic .arrow{
    font-weight:700; font-size:16px; line-height:1;
    flex-shrink:0;
  }
  .traffic .down-arrow{ color:var(--accent-3) }
  .traffic .up-arrow  { color:var(--accent-2) }
  .traffic .label-inline{
    font-size:11px;
    color:var(--text-mute);
    text-transform:uppercase;
    letter-spacing:.12em;
    font-family:var(--font-ui);
    font-weight:500;
    flex-shrink:0;
  }
  .traffic .val{
    font-weight:600;
    font-size:16px;
    letter-spacing:-.01em;
    color:var(--text);
    font-variant-numeric: tabular-nums;
    white-space:nowrap;
  }
  .traffic .val .val-num{
    display:inline-block;
    text-align:right;
    min-width: 4.1em;
  }
  .traffic .val .val-unit{
    display:inline-block;
    text-align:left;
    font-size:11px;
    color:var(--text-dim);
    font-weight:400;
    margin-left:2px;
    min-width: 2.7em;
  }
  .traffic .val.rate.down{ color:var(--accent-3) }
  .traffic .val.rate.up  { color:var(--accent-2) }
  .traffic .sep{
    color:var(--text-mute); font-size:12px;
    padding:0 2px;
  }
  .traffic .total-label{
    font-size:11px;
    color:var(--text-mute);
    text-transform:uppercase;
    letter-spacing:.12em;
    font-family:var(--font-ui);
    font-weight:500;
  }

  .offline-msg{
    color:var(--text-mute); font-size:12px;
    padding:14px 0 4px; text-align:center;
  }

  footer{
    margin-top:30px; padding-top:16px;
    border-top:1px solid var(--line);
    color:var(--text-mute); font-size:11px;
    display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }

  /* tooltip */
  #tip{
    position:fixed;
    z-index:1000;
    pointer-events:none;
    background:var(--tip-bg);
    border:1px solid var(--tip-border);
    border-radius:10px;
    padding:11px 13px;
    box-shadow:var(--tip-shadow);
    min-width:200px;
    max-width:320px;
    opacity:0;
    transform:translateY(4px);
    transition:opacity .12s ease, transform .12s ease;
    font-size:12px;
    color:var(--text);
  }
  #tip.show{ opacity:1; transform:translateY(0) }
  #tip .tip-head{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
    margin-bottom:8px;
    padding-bottom:7px;
    border-bottom:1px solid var(--line);
  }
  #tip .tip-title{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.14em;
    color:var(--text-mute);
    font-weight:600;
  }
  #tip .tip-pct{
    font-family:var(--font-num);
    font-size:13px;
    font-weight:600;
    color:var(--text);
  }
  #tip .tip-row{
    display:flex; justify-content:space-between; align-items:baseline;
    gap:14px;
    padding:3px 0;
  }
  #tip .tip-row.stack{
    flex-direction:column;
    align-items:stretch;
    gap:3px;
  }
  #tip .tip-row .k{
    color:var(--text-mute);
    font-size:11.5px;
    flex-shrink:0;
  }
  #tip .tip-row .v{
    font-family:var(--font-num);
    color:var(--text);
    font-size:12px;
    text-align:right;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    max-width:200px;
  }
  #tip .tip-row.stack .v{
    text-align:left;
    white-space:normal;
    word-break:break-word;
    max-width:none;
    line-height:1.35;
  }
  #tip .tip-row .v.dim{ color:var(--text-dim) }

  @media (max-width:560px){
    .wrap{ padding:20px 14px 36px }
    header{ flex-direction:column; align-items:flex-start; gap:12px }

    .card{ padding:12px 14px }
    .card-head{ margin-bottom:10px }
    .card-head .name{ font-size:15px }
    .uptime-badge{ font-size:10.5px; padding:3px 9px }

    .card-body{
      grid-template-columns: 1fr;
      gap:10px;
    }
    .rings{ gap:8px }
    .ring{ width:70px; height:70px }
    .ring .label .num{ font-size:15px }
    .ring .label .num small{ font-size:9px }
    .ring .label .cap{ font-size:9.5px; margin-top:3px }

    .traffic{ gap:6px }
    .traffic .row{ gap:6px }
    .traffic .sep{
      flex:1;
      color:transparent;
      padding:0;
    }
    .traffic .val{ font-size:14px }
    .traffic .arrow{ font-size:14px }
    .traffic .label-inline,
    .traffic .total-label{ font-size:10px }
    .traffic .val .val-unit{ font-size:10px }

    #tip{ max-width:260px; min-width:180px; font-size:11.5px }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <span class="dot"></span>
      <h1>server<span>.</span>status</h1>
      <span class="sub">live</span>
    </div>
    <div class="meta">
      <div>共 <b id="m-count">—</b> 台</div>
      <div>在线 <b id="m-online">—</b></div>
      <div>更新 <b id="m-time">—</b></div>
      <div class="pill" id="m-pill">运行中</div>
    </div>
  </header>

  <div id="stack" class="stack"></div>

  <footer>
    <span>server.status · 每 2 秒刷新</span>
    <span id="m-foot">—</span>
  </footer>
</div>

<div id="tip" role="tooltip" aria-hidden="true"></div>

<script>
const RING_R = 26;
const RING_C = 2 * Math.PI * RING_R;

const latest = { servers: [] };

const fmt = {
  bytesParts(n){
    if (n == null || isNaN(n) || n < 0) return { num:'—', unit:'' };
    const u = ['B','KB','MB','GB','TB','PB'];
    let i = 0, v = Number(n);
    while (v >= 1024 && i < u.length - 1){ v /= 1024; i++; }
    const num = (i === 0) ? String(Math.round(v)) : v.toFixed(2);
    return { num, unit: u[i] };
  },
  bytes(n){
    const { num, unit } = fmt.bytesParts(n);
    return num === '—' ? '—' : (num + ' ' + unit);
  },
  pctInt(n){
    if (n == null || isNaN(n)) return '—';
    return String(Math.round(Number(n)));
  },
  pct2(n){
    if (n == null || isNaN(n)) return '—';
    return Number(n).toFixed(2) + '%';
  },
  num2(n){
    if (n == null || isNaN(n)) return '—';
    return Number(n).toFixed(2);
  },
  mhz(n){
    if (n == null || isNaN(n) || n <= 0) return '—';
    const v = Number(n);
    if (v >= 1000) return (v / 1000).toFixed(2) + ' GHz';
    return v.toFixed(0) + ' MHz';
  },
  uptimeDays(bootTimeMs){
    if (bootTimeMs == null || isNaN(bootTimeMs)) return '—';
    const boot = new Date(Number(bootTimeMs));
    const now  = new Date();
    if (now < boot) return '—';
    const a = Date.UTC(boot.getFullYear(), boot.getMonth(), boot.getDate());
    const b = Date.UTC(now.getFullYear(),  now.getMonth(),  now.getDate());
    return Math.round((b - a) / 86400000) + '天';
  },
  clock(){
    const d = new Date();
    const p = (n) => String(n).padStart(2,'0');
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  },
};

function severityColor(pct){
  if (pct >= 90) return 'var(--danger)';
  if (pct >= 70) return 'var(--warn)';
  return 'var(--accent)';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function ringHTML(caption, kind){
  return `
    <div class="ring-cell" data-kind="${kind}">
      <div class="ring">
        <svg viewBox="0 0 64 64">
          <circle class="track" cx="32" cy="32" r="${RING_R}"></circle>
          <circle class="arc"   cx="32" cy="32" r="${RING_R}"></circle>
        </svg>
        <div class="label">
          <span class="num">—<small>%</small></span>
          <span class="cap">${caption}</span>
        </div>
      </div>
    </div>
  `;
}

function cardHTML(s, idx){
  if (!s.online || !s.metrics){
    return `
      <div class="card offline" data-name="${escapeHtml(s.name)}" data-idx="${idx}">
        <div class="card-head">
          <div class="name">${escapeHtml(s.name)}</div>
          <span class="uptime-badge off">离线</span>
        </div>
        <div class="offline-msg">无法连接 · 等待恢复…</div>
      </div>
    `;
  }
  return `
    <div class="card" data-name="${escapeHtml(s.name)}" data-idx="${idx}">
      <div class="card-head">
        <div class="name">${escapeHtml(s.name)}</div>
        <span class="uptime-badge" data-uptime>—</span>
      </div>

      <div class="card-body">
        <div class="rings">
          ${ringHTML('CPU',  'cpu')}
          ${ringHTML('内存', 'mem')}
          ${ringHTML('硬盘', 'disk')}
          ${ringHTML('负载', 'load')}
        </div>

        <div class="traffic">
          <div class="row">
            <span class="arrow up-arrow">↑</span>
            <span class="label-inline">上行</span>
            <span class="val rate up" data-up-rate>—</span>
            <span class="sep">·</span>
            <span class="total-label">总发</span>
            <span class="val" data-up-total>—</span>
          </div>
          <div class="row">
            <span class="arrow down-arrow">↓</span>
            <span class="label-inline">下行</span>
            <span class="val rate down" data-down-rate>—</span>
            <span class="sep">·</span>
            <span class="total-label">总收</span>
            <span class="val" data-down-total>—</span>
          </div>
        </div>
      </div>
    </div>
  `;
}

function setRing(cell, pct, valueText, unitText){
  const p = Math.max(0, Math.min(100, Number(pct) || 0));
  const arc = cell.querySelector('.arc');
  const dash = (p / 100) * RING_C;
  arc.style.stroke = severityColor(p);
  arc.style.strokeDasharray = dash + ' ' + RING_C;

  const num = cell.querySelector('.label .num');
  if (num){
    num.innerHTML = escapeHtml(String(valueText)) +
      (unitText ? '<small>' + escapeHtml(unitText) + '</small>' : '');
  }
}

function setBytesField(el, bytes, perSec){
  if (!el) return;
  const { num, unit } = fmt.bytesParts(bytes);
  if (num === '—'){ el.textContent = '—'; return; }
  el.innerHTML =
    '<span class="val-num">' + escapeHtml(num) + '</span>' +
    '<span class="val-unit">' + escapeHtml(unit) + (perSec ? '/s' : '') + '</span>';
}

function paintCard(el, s){
  const m = s.metrics;
  const cells = el.querySelectorAll('.ring-cell');
  setRing(cells[0], m.cpu.pct,  fmt.pctInt(m.cpu.pct),  '%');
  setRing(cells[1], m.mem.pct,  fmt.pctInt(m.mem.pct),  '%');
  setRing(cells[2], m.disk.pct, fmt.pctInt(m.disk.pct), '%');
  setRing(cells[3], m.load.pct, fmt.pctInt(m.load.pct), '%');

  setBytesField(el.querySelector('[data-down-rate]'),  m.net.downRate,  true);
  setBytesField(el.querySelector('[data-up-rate]'),    m.net.upRate,    true);
  setBytesField(el.querySelector('[data-down-total]'), m.net.recvTotal, false);
  setBytesField(el.querySelector('[data-up-total]'),   m.net.sentTotal, false);

  const ub = el.querySelector('[data-uptime]');
  if (ub){
    ub.textContent = fmt.uptimeDays(s.bootTimeMs);
    ub.classList.remove('off');
  }
}

let mounted = false;
function render(servers){
  const stack = document.getElementById('stack');

  const needFullMount =
    !mounted ||
    stack.children.length !== servers.length ||
    Array.from(stack.children).some((node, i) => node.dataset.name !== servers[i].name);

  if (needFullMount){
    stack.innerHTML = servers.map((s, i) => cardHTML(s, i)).join('');
    mounted = true;
    servers.forEach((s, i) => {
      if (s.online && s.metrics) paintCard(stack.children[i], s);
    });
    refreshTip();
    return;
  }

  servers.forEach((s, i) => {
    const node = stack.children[i];
    node.dataset.idx = String(i);
    const wantOffline = !s.online || !s.metrics;
    const isOffline = node.classList.contains('offline');
    if (wantOffline !== isOffline){
      node.outerHTML = cardHTML(s, i);
      if (!wantOffline) paintCard(stack.children[i], s);
      return;
    }
    if (wantOffline) return;
    paintCard(node, s);
  });

  refreshTip();
}

const tip = {
  el: document.getElementById('tip'),
  visible: false,
  serverIdx: null,
  kind: null,
  lastX: 0,
  lastY: 0,
};

function buildTipHTML(s, kind){
  const m = s.metrics;
  if (!m) return '';

  if (kind === 'cpu'){
    const c = m.cpu;
    const rows = [
      ['型号',   c.model || '—', { stack: true, dim: true }],
      ['物理核心', c.cores ? c.cores + ' 核' : '—'],
      ['逻辑核心', c.logicalCores ? c.logicalCores + ' 线程' : '—'],
      ['频率',   fmt.mhz(c.mhz)],
    ];
    return tipShell('CPU', fmt.pct2(c.pct), rows);
  }
  if (kind === 'mem'){
    const me = m.mem;
    const rows = [
      ['总量', fmt.bytes(me.total)],
      ['已用', fmt.bytes(me.used)],
      ['可用', fmt.bytes(me.available)],
    ];
    return tipShell('内存', fmt.pct2(me.pct), rows);
  }
  if (kind === 'disk'){
    const d = m.disk;
    const rows = [
      ['总量', fmt.bytes(d.total)],
      ['已用', fmt.bytes(d.used)],
      ['可用', fmt.bytes(d.free)],
    ];
    return tipShell('硬盘', fmt.pct2(d.pct), rows);
  }
  if (kind === 'load'){
    const l = m.load;
    const rows = [
      ['1 分钟',  fmt.num2(l.load1)],
      ['5 分钟',  fmt.num2(l.load5)],
      ['15 分钟', fmt.num2(l.load15)],
    ];
    return tipShell('负载', fmt.pct2(l.pct), rows);
  }
  return '';
}

function tipShell(title, pctText, rows){
  const body = rows.map(([k, v, opts]) => {
    const o = opts || {};
    const rowCls = 'tip-row' + (o.stack ? ' stack' : '');
    const vCls   = 'v' + (o.dim ? ' dim' : '');
    const titleAttr = o.stack ? '' : ` title="${escapeHtml(v)}"`;
    return `<div class="${rowCls}"><span class="k">${escapeHtml(k)}</span><span class="${vCls}"${titleAttr}>${escapeHtml(v)}</span></div>`;
  }).join('');
  return `
    <div class="tip-head">
      <span class="tip-title">${escapeHtml(title)}</span>
      <span class="tip-pct">${escapeHtml(pctText)}</span>
    </div>
    ${body}
  `;
}

function showTip(serverIdx, kind, x, y){
  const s = latest.servers[serverIdx];
  if (!s || !s.online || !s.metrics) return;
  tip.serverIdx = serverIdx;
  tip.kind = kind;
  tip.el.innerHTML = buildTipHTML(s, kind);
  tip.el.classList.add('show');
  tip.el.setAttribute('aria-hidden', 'false');
  tip.visible = true;
  positionTip(x, y);
}

function hideTip(){
  tip.visible = false;
  tip.serverIdx = null;
  tip.kind = null;
  tip.el.classList.remove('show');
  tip.el.setAttribute('aria-hidden', 'true');
}

function refreshTip(){
  if (!tip.visible || tip.serverIdx == null || tip.kind == null) return;
  const s = latest.servers[tip.serverIdx];
  if (!s || !s.online || !s.metrics){ hideTip(); return; }
  tip.el.innerHTML = buildTipHTML(s, tip.kind);
}

function positionTip(x, y){
  tip.lastX = x;
  tip.lastY = y;
  const pad = 14;
  const w = tip.el.offsetWidth;
  const h = tip.el.offsetHeight;
  let nx = x + pad;
  let ny = y + pad;
  if (nx + w + 6 > window.innerWidth)  nx = x - w - pad;
  if (ny + h + 6 > window.innerHeight) ny = y - h - pad;
  if (nx < 6) nx = 6;
  if (ny < 6) ny = 6;
  tip.el.style.left = nx + 'px';
  tip.el.style.top  = ny + 'px';
}

const stackEl = document.getElementById('stack');

function cellInfo(target){
  const cell = target.closest('.ring-cell');
  if (!cell) return null;
  const card = cell.closest('.card');
  if (!card || card.classList.contains('offline')) return null;
  const idx = parseInt(card.dataset.idx, 10);
  const kind = cell.dataset.kind;
  if (isNaN(idx) || !kind) return null;
  return { idx, kind };
}

let touchUntil = 0;
function isTouchActive(){ return Date.now() < touchUntil; }

stackEl.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch' || e.pointerType === 'pen'){
    touchUntil = Date.now() + 700;
  }
});

stackEl.addEventListener('mouseover', (e) => {
  if (isTouchActive()) return;
  const info = cellInfo(e.target);
  if (!info) return;
  showTip(info.idx, info.kind, e.clientX, e.clientY);
});
stackEl.addEventListener('mousemove', (e) => {
  if (isTouchActive()) return;
  if (!tip.visible) return;
  const info = cellInfo(e.target);
  if (!info){ hideTip(); return; }
  if (info.idx !== tip.serverIdx || info.kind !== tip.kind){
    showTip(info.idx, info.kind, e.clientX, e.clientY);
  } else {
    positionTip(e.clientX, e.clientY);
  }
});
stackEl.addEventListener('mouseout', (e) => {
  if (isTouchActive()) return;
  const to = e.relatedTarget;
  if (to && to.closest && to.closest('.ring-cell')) return;
  hideTip();
});

stackEl.addEventListener('click', (e) => {
  const info = cellInfo(e.target);
  if (!info){ hideTip(); return; }
  if (tip.visible && tip.serverIdx === info.idx && tip.kind === info.kind){
    hideTip();
  } else {
    const rect = e.target.getBoundingClientRect();
    showTip(info.idx, info.kind, rect.left + rect.width / 2, rect.top + rect.height / 2);
  }
});
document.addEventListener('click', (e) => {
  if (!tip.visible) return;
  if (!e.target.closest('.ring-cell')) hideTip();
});
window.addEventListener('scroll', () => hideTip(), { passive: true });
window.addEventListener('resize', () => hideTip());

async function tick(){
  try {
    const r = await fetch('/api/servers', { cache:'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const servers = await r.json();
    latest.servers = servers;
    render(servers);
    document.getElementById('m-count').textContent  = servers.length;
    document.getElementById('m-online').textContent = servers.filter(s => s.online).length;
    document.getElementById('m-time').textContent   = fmt.clock();
    document.getElementById('m-foot').textContent   = '最后更新 ' + fmt.clock();
    const pill = document.getElementById('m-pill');
    pill.textContent = '运行中';
    pill.style.opacity = '1';
  } catch (e) {
    const pill = document.getElementById('m-pill');
    pill.textContent = '断开';
    pill.style.opacity = '.5';
  }
}

tick();
setInterval(tick, 2000);
</script>
</body>
</html>
