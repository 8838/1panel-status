<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" type="image/png" sizes="128x128" href="/logo.png">
<title>服务器状态</title>
<style>
  :root{
    /* ── dark theme (default) ──────────────────────────────────────────
       Variables are split into two groups:
       1. Color tokens — overridden in the light-mode block below.
       2. Non-color tokens (fonts, sizes) — single source of truth.       */

    --bg: #0c0d10;
    --panel: #16181f;
    --panel-2: #1c1f27;
    --line: #262a35;
    --text: #e7e7ea;
    --text-dim: #8b8f9a;
    --text-mute: #5a5e69;
    --accent: #8b5cf6;
    --accent-2: #ff7a59;
    --accent-3: #5ad1ff;
    --warn: #ffd166;
    --danger: #ff5b6b;
    --ok: #8af0a4;
    --ring-bg: #21242d;

    /* Background ambience: two soft tinted glows in opposite corners. In
       dark mode they're barely-there hints of the accent palette; in light
       mode we tune them way down so the page reads as crisp, not muddy.   */
    --glow-1: rgba(200,255,62,.05);
    --glow-2: rgba(90,209,255,.04);

    /* Card-corner highlight (the diagonal radial inside .card::after).
       Same idea — visible in dark, near-zero in light.                    */
    --card-glow: rgba(200,255,62,.04);

    /* Brand dot glow and the ok-state pill dot glow. CSS box-shadow with
       a non-zero blur. In light mode we kill it so the dot doesn't smear
       on a white background.                                              */
    --dot-glow: 0 0 10px var(--accent);
    --ok-glow:  0 0 6px var(--ok);
    --ok-glow-sm: 0 0 5px var(--ok);

    /* Subtle "inset"-feeling tint for badges sitting on top of the card.
       Dark theme: a faint black wash. Light theme: a faint grey wash.    */
    --inset-tint: rgba(0,0,0,.2);

    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    --font-num: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                "Liberation Mono", "Courier New", monospace;

    --card-max: 720px;
  }

  /* ── light theme ────────────────────────────────────────────────────
     Triggered automatically by the OS / browser preference. We don't ship
     a manual toggle — the page is small, single-purpose, and following
     system theme is the least-surprise default for an internal dashboard.

     Design notes:
     - Background is a near-white off-grey (#f6f7f9), cards are pure white
       so the depth hierarchy still reads. Pure-white background would be
       too clinical and lose the card-vs-page separation.
     - The neon-green --accent (#8b5cf6) is unreadable on a near-white
       surface — bright fluorescent colors need a dark background. We
       swap to a deep saturated green (#a8e635) that keeps the "lime"
       identity but actually has contrast. Same logic for --accent-2 /
       --accent-3: pulled toward more saturated, lower-luminance versions.
     - --ring-bg switches from near-black to a soft light grey so the
       unfilled portion of the donut reads as "empty" instead of "filled
       with white" (which would be confusing on a white card).
     - All glows are zeroed out: glow effects look cheap on light
       backgrounds and tend to read as smudges, not light.                */
  @media (prefers-color-scheme: light){
    :root{
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-2: #fbfbfc;
      --line: #e5e7ec;
      --text: #1a1c22;
      --text-dim: #5a5e69;
      --text-mute: #9095a0;
      --accent: #a8e635;       /* deep lime, readable on white */
      --accent-2: #d94e2b;     /* warm orange-red */
      --accent-3: #0a8ec7;     /* deep cyan */
      --warn: #c98a00;         /* amber */
      --danger: #d62c3d;       /* red */
      --ok: #2a9e4f;           /* green */
      --ring-bg: #e6e8ec;

      --glow-1: transparent;
      --glow-2: transparent;
      --card-glow: transparent;
      --dot-glow: none;
      --ok-glow: none;
      --ok-glow-sm: none;
      --inset-tint: rgba(0,0,0,.03);
    }
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 85% -10%, var(--glow-1), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, var(--glow-2), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    font-size:13px;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{
    max-width: var(--card-max);
    margin: 0 auto;
    padding: 32px 24px 56px;
  }

  /* ── header ───────────────────────────── */
  header{
    display:flex; justify-content:space-between; align-items:flex-end;
    gap:24px; padding-bottom:18px;
    border-bottom:1px solid var(--line); margin-bottom:24px;
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand .dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--accent); box-shadow:var(--dot-glow);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.55;transform:scale(.82)} }
  .brand h1{
    margin:0; font-size:22px; font-weight:600;
    letter-spacing:-.01em; line-height:1;
  }
  .brand h1 span{ color:var(--accent) }
  .brand .sub{
    color:var(--text-mute); font-size:10.5px;
    text-transform:uppercase; letter-spacing:.22em;
  }
  .meta{
    color:var(--text-dim); font-size:12px;
    display:flex; gap:18px; align-items:center; flex-wrap:wrap;
  }
  .meta b{ color:var(--text); font-weight:600; font-family:var(--font-num) }
  .meta .pill{
    display:inline-flex; align-items:center; gap:7px;
    padding:5px 11px; border:1px solid var(--line); border-radius:99px;
    background:var(--panel);
  }
  .meta .pill::before{
    content:""; width:6px; height:6px; border-radius:50%;
    background:var(--ok); box-shadow:var(--ok-glow);
  }

  /* ── stack of cards (one per row) ─────── */
  .stack{ display:flex; flex-direction:column; gap:14px; }

  /* ── card ─────────────────────────────── */
  .card{
    background:linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 18px;
    position:relative;
    min-width:0;
  }
  .card.offline{ opacity:.55 }
  .card::after{
    content:""; position:absolute; top:0; right:0;
    width:140px; height:100%;
    background:radial-gradient(circle at top right, var(--card-glow), transparent 70%);
    pointer-events:none;
    border-top-right-radius:14px;
    border-bottom-right-radius:14px;
  }

  /* ── card header (name + uptime badge) ── */
  .card-head{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-bottom:10px;
  }
  .card-head .name{
    font-size:17px; font-weight:600; letter-spacing:-.01em;
    color:var(--text); line-height:1.2;
    min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .uptime-badge{
    display:inline-flex; align-items:center; gap:7px;
    padding:4px 11px; border:1px solid var(--line); border-radius:99px;
    font-size:11px; color:var(--text-dim);
    background:var(--inset-tint);
    flex-shrink:0;
    font-family:var(--font-num);
    white-space:nowrap;
  }
  .uptime-badge::before{
    content:""; width:5px; height:5px; border-radius:50%;
    background:var(--ok); box-shadow:var(--ok-glow-sm);
    flex-shrink:0;
  }
  .uptime-badge.off{ color:var(--text-mute) }
  .uptime-badge.off::before{ background:var(--danger); box-shadow:none }

  /* ── card body: rings (left) + traffic (right) on desktop ── */
  .card-body{
    display:grid;
    grid-template-columns: 1fr auto;
    gap:18px;
    align-items:center;
  }

  /* ── rings row ─────────────────────────── */
  .rings{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:8px;
    min-width:0;
  }
  .ring-cell{
    display:flex; align-items:center; justify-content:center;
    min-width:0;
  }
  .ring{
    position:relative;
    width:78px; height:78px;
  }
  .ring svg{
    width:100%; height:100%;
    transform: rotate(-90deg);
  }
  .ring .track{
    fill:none; stroke:var(--ring-bg); stroke-width:6;
  }
  .ring .arc{
    fill:none; stroke-width:6; stroke-linecap:round;
    stroke-dasharray: 0 999;
    transition: stroke-dasharray .6s cubic-bezier(.2,.7,.2,1), stroke .3s;
  }
  .ring .label{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    color:var(--text); line-height:1;
    text-align:center;
    pointer-events:none;
    padding:0 4px;
  }
  .ring .label .num{
    font-family:var(--font-num);
    font-weight:600;
    font-size:16px;
    letter-spacing:-.03em;
    display:inline-flex; align-items:baseline; justify-content:center;
  }
  .ring .label .num small{
    font-size:9px;
    color:var(--text-dim);
    font-weight:500;
    margin-left:1px;
  }
  .ring .label .cap{
    margin-top:4px;
    font-size:9.5px;
    color:var(--text-mute);
    text-transform:uppercase;
    letter-spacing:.12em;
    font-weight:500;
  }

  /* ── traffic block (right side on desktop) ──
     Two rows: down on top, up on bottom. Each row reads like
     "↓ 下行 12.50 MB/s · 1023.58 GB". No column heads, no divider line.
     Sized to align visually with the rings to its left.                */
  .traffic{
    display:flex; flex-direction:column;
    justify-content:center;
    gap:8px;
    font-family:var(--font-num);
    white-space:nowrap;
  }
  .traffic .row{
    display:flex; align-items:baseline; gap:8px;
  }
  .traffic .arrow{
    font-weight:700; font-size:15px; line-height:1;
    flex-shrink:0;
  }
  .traffic .down-arrow{ color:var(--accent-3) }
  .traffic .up-arrow  { color:var(--accent-2) }
  .traffic .label-inline{
    font-size:10px;
    color:var(--text-mute);
    text-transform:uppercase;
    letter-spacing:.12em;
    font-family:var(--font-ui);
    font-weight:500;
    flex-shrink:0;
  }
  .traffic .val{
    font-weight:600;
    font-size:15px;
    letter-spacing:-.01em;
    color:var(--text);
    font-variant-numeric: tabular-nums;
    /* The value cell is a fixed-width row of [number][unit]. The number is
       right-aligned in its own box so the decimal point sits at the same
       column regardless of digit count; the unit is left-aligned so the
       label start column doesn't jitter either. The widths below are sized
       for the worst case the formatter can produce ("1023.99") and for the
       longest unit suffix (" GB/s"). We deliberately don't use `ch` for the
       number column because under tabular-nums digits are all the width of
       "0" but the decimal point is narrower than "0" — using ch would
       overshoot by ~0.5ch and look loose. `em` matches the actual rendered
       advance much more closely.                                            */
    white-space:nowrap;
  }
  .traffic .val .val-num{
    display:inline-block;
    text-align:right;
    /* 6 digits + 1 decimal point. Under tabular-nums each digit is 1ch and
       the decimal point is roughly 0.35ch, total ~6.35ch ≈ 4em at this
       font-size. Bumped to 4.1em to give the decimal point breathing room.   */
    min-width: 4.1em;
  }
  .traffic .val .val-unit{
    display:inline-block;
    text-align:left;
    font-size:10.5px;
    color:var(--text-dim);
    font-weight:400;
    margin-left:2px;
    /* Worst-case unit suffix in the formatter is " GB/s" (5 chars). At the
       small font size that's ~2.6em — round up so totals (" GB", 3 chars)
       still left-align under the same column.                               */
    min-width: 2.7em;
  }
  .traffic .val.rate.down{ color:var(--accent-3) }
  .traffic .val.rate.up  { color:var(--accent-2) }
  .traffic .sep{
    color:var(--text-mute); font-size:11px;
    padding:0 2px;
  }
  .traffic .total-label{
    font-size:10px;
    color:var(--text-mute);
    text-transform:uppercase;
    letter-spacing:.12em;
    font-family:var(--font-ui);
    font-weight:500;
  }

  .offline-msg{
    color:var(--text-mute); font-size:12px;
    padding:14px 0 4px; text-align:center;
  }

  footer{
    margin-top:30px; padding-top:16px;
    border-top:1px solid var(--line);
    color:var(--text-mute); font-size:11px;
    display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  footer a{
    color:var(--text-mute); text-decoration:none;
    transition: color .2s;
  }
  footer a:hover{ color:var(--accent) }

  /* ── narrow viewport ─────────────────── */
  @media (max-width:560px){
    .wrap{ padding:20px 14px 36px }
    header{ flex-direction:column; align-items:flex-start; gap:12px }

    .card{ padding:12px 14px }
    .card-head .name{ font-size:15px }
    .uptime-badge{ font-size:10.5px; padding:3px 9px }

    /* phone: stack rings above traffic */
    .card-body{
      grid-template-columns: 1fr;
      gap:10px;
    }
    .ring{ width:68px; height:68px }
    .ring .label .num{ font-size:14px }
    .ring .label .num small{ font-size:8px }
    .ring .label .cap{ font-size:9px; margin-top:3px }

    /* traffic on phone: keep two-row layout (down, up).
       Within each row, push the "总收/发 …" cluster to the right edge. */
    .traffic{
      gap:6px;
    }
    .traffic .row{
      gap:6px;
    }
    /* The separator dot becomes a flex spacer that eats remaining width,
       pushing the total cluster to the right. */
    .traffic .sep{
      flex:1;
      color:transparent;
      padding:0;
    }
    .traffic .val{ font-size:14px }
    .traffic .arrow{ font-size:14px }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <span class="dot"></span>
      <h1>server<span>.</span>status</h1>
      <span class="sub">live</span>
    </div>
    <div class="meta">
      <div>共 <b id="m-count">—</b> 台</div>
      <div>在线 <b id="m-online">—</b></div>
      <div>更新 <b id="m-time">—</b></div>
      <div class="pill" id="m-pill">运行中</div>
    </div>
  </header>

  <div id="stack" class="stack"></div>

  <footer>
    <span>server.status · 每 2 秒刷新</span>
    <a id="m-foot" href="https://github.com/8838/1panel-status" target="_blank" rel="noopener noreferrer">GitHub</a>
  </footer>
</div>

<script>
const RING_R = 26;
const RING_C = 2 * Math.PI * RING_R;

const fmt = {
  // Byte formatter. Returns { num, unit } so callers can render the unit
  // in a smaller style. Always keeps 2 decimal places so something like
  // "1023.58 GB" survives intact instead of getting rounded to "1024 GB".
  // (The old code only kept decimals for v < 100, which truncated big values.)
  bytesParts(n){
    if (n == null || isNaN(n) || n < 0) return { num:'—', unit:'' };
    const u = ['B','KB','MB','GB','TB','PB'];
    let i = 0, v = Number(n);
    while (v >= 1024 && i < u.length - 1){ v /= 1024; i++; }
    // Bytes are integers; everything else gets 2 decimals.
    const num = (i === 0) ? String(Math.round(v)) : v.toFixed(2);
    return { num, unit: u[i] };
  },
  pctInt(n){
    if (n == null || isNaN(n)) return '—';
    return String(Math.round(Number(n)));
  },
  // Uptime as whole days, computed as the difference between local calendar
  // dates (Y/M/D), ignoring hours/minutes/seconds. Example: server booted
  // 2026-05-12 23:00, now is 2026-05-13 01:00 → 1 day, not 0. This matches
  // user intent ("已运行 N 天" as a date-difference, not a 24h-bucket count)
  // and avoids the off-by-one near midnight that `floor(diffMs / 86400000)`
  // would produce.
  //
  // bootTimeMs is the proxy's fixed parse of the server's reported boot time
  // (server.js parses it once); we interpret both endpoints in the browser's
  // local timezone, which is what the badge user is reading anyway.
  uptimeDays(bootTimeMs){
    if (bootTimeMs == null || isNaN(bootTimeMs)) return '—';
    const boot = new Date(Number(bootTimeMs));
    const now  = new Date();
    if (now < boot) return '—';
    // Reduce each side to a midnight-local timestamp, then subtract. Using
    // Date.UTC on the local Y/M/D triple sidesteps DST transitions (which
    // would otherwise make some "days" 23 or 25 hours long).
    const a = Date.UTC(boot.getFullYear(), boot.getMonth(), boot.getDate());
    const b = Date.UTC(now.getFullYear(),  now.getMonth(),  now.getDate());
    return Math.round((b - a) / 86400000) + '天';
  },
  clock(){
    const d = new Date();
    const p = (n) => String(n).padStart(2,'0');
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  },
};

function severityColor(pct){
  if (pct >= 90) return 'var(--danger)';
  if (pct >= 70) return 'var(--warn)';
  return 'var(--accent)';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ── ring builder ────────────────────────────────────────
// caption is the text inside the ring, below the number
function ringHTML(caption){
  return `
    <div class="ring-cell">
      <div class="ring">
        <svg viewBox="0 0 64 64">
          <circle class="track" cx="32" cy="32" r="${RING_R}"></circle>
          <circle class="arc"   cx="32" cy="32" r="${RING_R}"></circle>
        </svg>
        <div class="label">
          <span class="num">—<small>%</small></span>
          <span class="cap">${caption}</span>
        </div>
      </div>
    </div>
  `;
}

function cardHTML(s){
  if (!s.online || !s.metrics){
    return `
      <div class="card offline" data-name="${escapeHtml(s.name)}">
        <div class="card-head">
          <div class="name">${escapeHtml(s.name)}</div>
          <span class="uptime-badge off">离线</span>
        </div>
        <div class="offline-msg">无法连接 · 等待恢复…</div>
      </div>
    `;
  }
  return `
    <div class="card" data-name="${escapeHtml(s.name)}">
      <div class="card-head">
        <div class="name">${escapeHtml(s.name)}</div>
        <span class="uptime-badge" data-uptime>—</span>
      </div>

      <div class="card-body">
        <div class="rings">
          ${ringHTML('CPU')}
          ${ringHTML('内存')}
          ${ringHTML('硬盘')}
          ${ringHTML('负载')}
        </div>

        <div class="traffic">
          <div class="row">
            <span class="arrow up-arrow">↑</span>
            <span class="label-inline">上行</span>
            <span class="val rate up" data-up-rate>—</span>
            <span class="sep">·</span>
            <span class="total-label">总发</span>
            <span class="val" data-up-total>—</span>
          </div>
          <div class="row">
            <span class="arrow down-arrow">↓</span>
            <span class="label-inline">下行</span>
            <span class="val rate down" data-down-rate>—</span>
            <span class="sep">·</span>
            <span class="total-label">总收</span>
            <span class="val" data-down-total>—</span>
          </div>
        </div>
      </div>
    </div>
  `;
}

function setRing(cell, pct, valueText, unitText){
  const p = Math.max(0, Math.min(100, Number(pct) || 0));
  const arc = cell.querySelector('.arc');
  const dash = (p / 100) * RING_C;
  arc.style.stroke = severityColor(p);
  arc.style.strokeDasharray = dash + ' ' + RING_C;

  const num = cell.querySelector('.label .num');
  if (num){
    num.innerHTML = escapeHtml(String(valueText)) +
      (unitText ? '<small>' + escapeHtml(unitText) + '</small>' : '');
  }
}

// Render a byte value into an element. Splits number and unit into two
// separately sized inline-blocks so the decimal point stays put as digit
// count changes and the unit start column doesn't jitter either. See the
// width comments in CSS for the sizing rationale.
function setBytesField(el, bytes, perSec){
  if (!el) return;
  const { num, unit } = fmt.bytesParts(bytes);
  if (num === '—'){ el.textContent = '—'; return; }
  el.innerHTML =
    '<span class="val-num">' + escapeHtml(num) + '</span>' +
    '<span class="val-unit">' + escapeHtml(unit) + (perSec ? '/s' : '') + '</span>';
}

function paintCard(el, s){
  const m = s.metrics;
  const cells = el.querySelectorAll('.ring-cell');
  // Load ring uses loadPct (instantaneous load%), not the 1-minute load avg.
  setRing(cells[0], m.cpuPct,  fmt.pctInt(m.cpuPct),  '%');
  setRing(cells[1], m.memPct,  fmt.pctInt(m.memPct),  '%');
  setRing(cells[2], m.diskPct, fmt.pctInt(m.diskPct), '%');
  setRing(cells[3], m.loadPct, fmt.pctInt(m.loadPct), '%');

  setBytesField(el.querySelector('[data-down-rate]'),  m.downRate,     true);
  setBytesField(el.querySelector('[data-up-rate]'),    m.upRate,       true);
  setBytesField(el.querySelector('[data-down-total]'), m.netRecvTotal, false);
  setBytesField(el.querySelector('[data-up-total]'),   m.netSentTotal, false);

  // Uptime: derived client-side from a fixed boot timestamp captured once on
  // the proxy. bootTimeMs is null until the first successful poll for this
  // server, in which case we show a dash rather than guessing.
  const ub = el.querySelector('[data-uptime]');
  if (ub){
    ub.textContent = fmt.uptimeDays(s.bootTimeMs);
    ub.classList.remove('off');
  }
}

// ── render loop ─────────────────────────────────
let mounted = false;
function render(servers){
  const stack = document.getElementById('stack');

  // If server count or order changed, full re-mount (cheap, runs only on config change)
  const needFullMount =
    !mounted ||
    stack.children.length !== servers.length ||
    Array.from(stack.children).some((node, i) => node.dataset.name !== servers[i].name);

  if (needFullMount){
    stack.innerHTML = servers.map(cardHTML).join('');
    mounted = true;
    servers.forEach((s, i) => {
      if (s.online && s.metrics) paintCard(stack.children[i], s);
    });
    return;
  }

  servers.forEach((s, i) => {
    const node = stack.children[i];
    const wantOffline = !s.online || !s.metrics;
    const isOffline = node.classList.contains('offline');
    if (wantOffline !== isOffline){
      node.outerHTML = cardHTML(s);
      if (!wantOffline) paintCard(stack.children[i], s);
      return;
    }
    if (wantOffline) return;
    paintCard(node, s);
  });
}

async function tick(){
  try {
    const r = await fetch('/api/servers', { cache:'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const servers = await r.json();
    render(servers);
    document.getElementById('m-count').textContent  = servers.length;
    document.getElementById('m-online').textContent = servers.filter(s => s.online).length;
    document.getElementById('m-time').textContent   = fmt.clock();
    const pill = document.getElementById('m-pill');
    pill.textContent = '运行中';
    pill.style.opacity = '1';
  } catch (e) {
    const pill = document.getElementById('m-pill');
    pill.textContent = '断开';
    pill.style.opacity = '.5';
  }
}

tick();
setInterval(tick, 2000);
</script>
</body>
</html>
